name: Build Windows release

on:
  push:
    branches: [main, rename_demo]
    paths:
      - "智能重命名/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 智能重命名
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 智能重命名/package-lock.json

      - name: Install and dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run dist

      - name: Upload installers (no win-unpacked)
        uses: actions/upload-artifact@v4
        with:
          name: smart-rename-windows-x64
          path: |
            智能重命名/release/*.exe
            智能重命名/release/*.blockmap
          if-no-files-found: error
