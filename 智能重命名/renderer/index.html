<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能重命名</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>智能重命名</h1>
      <p class="subtitle">选择文件 → 配置规则 → 预览差异 → 执行（两阶段临时文件，避免同名冲突）</p>
    </header>

    <section class="toolbar">
      <button type="button" id="btnPick" class="btn primary">选择文件</button>
      <button type="button" id="btnPreview" class="btn">刷新预览</button>
      <button type="button" id="btnApply" class="btn danger" disabled>执行重命名</button>
      <span id="status" class="status"></span>
    </section>

    <section class="form-grid">
      <label>
        项目名 <span class="hint">（非法字符会替换为 _）</span>
        <input type="text" id="projectName" placeholder="例如 my-app" value="project" />
      </label>
      <label>
        日期格式
        <select id="dateFormat">
          <option value="iso">YYYY-MM-DD</option>
          <option value="compact">YYYYMMDD</option>
          <option value="datetime">YYYYMMDD_HHMMSS</option>
        </select>
      </label>
      <label>
        哈希前缀长度
        <input type="number" id="hashLength" min="4" max="16" value="6" />
      </label>
      <label>
        起始序号
        <input type="number" id="indexStart" min="0" value="1" />
      </label>
      <label>
        序号位数
        <input type="number" id="indexDigits" min="1" max="6" value="3" />
      </label>
      <label class="full">
        命名模板
        <input
          type="text"
          id="template"
          spellcheck="false"
          value="{hash}_{date}_{project}_{index}{ext}"
        />
        <span class="hint"
          >占位符：<code>{hash}</code> <code>{date}</code> <code>{project}</code>
          <code>{index}</code> <code>{orig}</code> <code>{ext}</code>（扩展名含点，如 .png）</span
        >
      </label>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>原文件名</th>
            <th>新文件名</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>

    <script src="app.js"></script>
  </body>
</html>
